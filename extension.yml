schema_version: "1.0"

extension:
  id: "sdd-orchestrator"
  name: "SDD Orchestrator for Spec-kit + Squad + Superpowers"
  version: "1.5.0"
  description: "Integrates Spec-kit with Squad and Superpowers to orchestrate multi-agent workflows using Spec-Kit artifacts and Squad specialist agents."
  author: "Douglas Hennrich"
  repository: "https://github.com/DouglasHennrich/sdd-orchestrator"
  documentation: "https://github.com/DouglasHennrich/sdd-orchestrator/blob/main/README.md"
  changelog: "https://github.com/DouglasHennrich/sdd-orchestrator/blob/main/docs/CHANGELOG.md"
  license: "MIT"
  homepage: "https://github.com/DouglasHennrich/sdd-orchestrator"

requires:
  speckit_version: ">=0.8.18"
  tools:
    - name: "@bradygaster/squad-cli"
      version: ">=0.9.4"
      required: true
    - name: "superpowers"
      required: true

provides:
  commands:
    - name: "speckit.sdd-orchestrator.init"
      file: "commands/sdd.init.md"
      description: "Initialize SDD Orchestrator assets in the current project."
    - name: "speckit.sdd-orchestrator.generate"
      file: "commands/generate.md"
      description: "Re-generate Squad agent definitions when the spec changes."

    # --- Orchestration entry points (the flow users actually invoke) ---
    - name: "speckit.sdd-orchestrator.specify"
      file: "commands/orchestrate-specify.md"
      description: "Orchestrated specify: runs Phase -1/0/1 then stock speckit.specify (Phase 2)."
    - name: "speckit.sdd-orchestrator.implement"
      file: "commands/orchestrate-implement.md"
      description: "Orchestrated implement: verifies routing then fans out to specialist agents per phase."

    # --- Phase sub-commands (invoked by the orchestrator and by hooks) ---
    - name: "speckit.sdd-orchestrator.codebase-index"
      file: "commands/codebase-index.md"
      description: "Phase -1: build or refresh the repository knowledge graph."
    - name: "speckit.sdd-orchestrator.codebase-architect"
      file: "commands/codebase-architect.md"
      description: "Phase 0: produce a feature-scoped architecture analysis."
    - name: "speckit.sdd-orchestrator.discovery"
      file: "commands/discovery.md"
      description: "Phase 1: discovery — surface risks and open questions before the spec."
    - name: "speckit.sdd-orchestrator.route"
      file: "commands/route.md"
      description: "Phase 5: annotate tasks.md with →AgentName specialist assignments."

    - name: "speckit.sdd-orchestrator.api-contract"
      file: "commands/api-contract.md"
      description: "Detect API-impacting tasks and scaffold API.md contract documentation."

    - name: "speckit.sdd-orchestrator.after-tasks"
      file: "commands/after-tasks.md"
      description: "after_tasks pipeline: Phase 5 routing followed by API contract detection."

    - name: "speckit.sdd-orchestrator.tasks-audit"
      file: "commands/tasks-audit.md"
      description: "Post-implementation audit: verify all tasks, re-route failures, escalate after 3 cycles."

hooks:
  after_specify:
    command: "speckit.sdd-orchestrator.generate"
    optional: false
    prompt: "Spec updated — regenerate Squad agent definitions?"
    description: "Keeps Squad agents aligned as the spec evolves"

  after_tasks:
    command: "speckit.sdd-orchestrator.after-tasks"
    enabled: true
    optional: false
    prompt: "Route tasks and detect API contract changes?"
    description: "Phase 5 routing + API contract scaffolding after tasks.md is generated"
    condition: null

  after_implement:
    command: "speckit.sdd-orchestrator.tasks-audit"
    enabled: true
    optional: false
    description: "Audit all tasks after implementation — re-route failures automatically"

tags:
  - "multi-agent"
  - "agents"
  - "orchestration"
  - "process"
  - "integration"
