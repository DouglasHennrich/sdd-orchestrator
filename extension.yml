schema_version: "1.0"

extension:
  id: "sdd-orchestrator"
  name: "SDD Orchestrator for Spec-kit + Squad + Superpowers"
  version: "1.0.0"
  description: "Integrates Spec-kit with Squad and Superpowers to orchestrate multi-agent workflows using Spec-Kit artifacts and Squad specialist agents."
  author: "Douglas Hennrich"
  repository: "https://github.com/DouglasHennrich/sdd-orchestrator"
  documentation: "https://github.com/DouglasHennrich/sdd-orchestrator/blob/main/README.md"
  changelog: "https://github.com/DouglasHennrich/sdd-orchestrator/blob/main/docs/CHANGELOG.md"
  license: "MIT"
  homepage: "https://github.com/DouglasHennrich/sdd-orchestrator"

requires:
  speckit_version: ">=0.8.11"
  tools:
    - name: "@bradygaster/squad-cli"
      version: ">=0.9.4"
      required: true
    - name: "superpowers"
      required: true

provides:
  commands:
    - name: "speckit.sdd-orchestrator.init"
      file: "commands/sdd.init.md"
      description: "Initialize SDD Orchestrator assets in the current project."
    - name: "speckit.sdd-orchestrator.squad.generate"
      file: "commands/generate.md"
      description: "Re-generate Squad agent definitions when the spec changes."

hooks:
  after_specify:
    command: "speckit.sdd-orchestrator.squad.generate"
    optional: false
    prompt: "Spec updated — regenerate Squad agent definitions?"
    description: "Keeps Squad agents aligned as the spec evolves"

  after_tasks:
    command: "speckit.sdd-orchestrator.route"
    enabled: true
    optional: false
    prompt: Route tasks to specialist agents?
    description: Annotate tasks.md with →AgentName assignments (Phase 5)
    condition: null

tags:
  - "multi-agent"
  - "agents"
  - "orchestration"
  - "process"
  - "integration"
